# Test Configuration for Single RTX 3090 (24GB VRAM)
# This config is designed to test the training pipeline with minimal resources
# Model size: ~500M parameters (fits comfortably in 24GB)

checkpoints:
  checkpoint_interval: 50        # Save checkpoint every 50 steps
  checkpoints_path: checkpoints_test
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: null
  save_initial_state: false

data_stages:
- data:
    dataset: null                # Use dummy data for testing
    num_loading_workers: 1
    seed: 42
  name: Test Training Stage
  start_training_step: 1

general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: nanotron_test
  run: rtx3090_test_%date_%jobid
  seed: 42
  step: null

lighteval: null

logging:
  iteration_step_info_interval: 1  # Log every step for testing
  log_level: info
  log_level_replica: info

model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16                # Use bfloat16 for efficiency
  init_method:
    std: 0.025
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    hidden_size: 1024            # Reduced from 2048
    initializer_range: 0.02
    intermediate_size: 4096      # Reduced from 11008 (4x hidden_size)
    is_llama_config: true
    max_position_embeddings: 2048  # Reduced from 128256
    num_attention_heads: 8       # Reduced from 16
    num_hidden_layers: 12        # Reduced from 28
    num_key_value_heads: 2       # GQA for efficiency
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling: null
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 32000            # Reduced from 128256

optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.0003
    lr_decay_starting_step: null
    lr_decay_steps: 80           # Adjusted for shorter training
    lr_decay_style: cosine
    lr_warmup_steps: 10          # 10 warmup steps
    lr_warmup_style: linear
    min_decay_lr: 1.0e-05
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0                  # No ZeRO for single GPU

parallelism:
  dp: 1                          # Single GPU - no data parallelism
  expert_parallel_size: 1
  pp: 1                          # No pipeline parallelism
  pp_engine: 1f1b
  tp: 1                          # No tensor parallelism
  tp_linear_async_communication: false
  tp_mode: REDUCE_SCATTER

profiler:
  profiler_export_path: null     # Disable profiler for testing

tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: robot-test/dummy-tokenizer-wordlevel
  tokenizer_revision: null

tokens:
  batch_accumulation_per_replica: 4  # Gradient accumulation
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 2            # Small batch size for testing
  sequence_length: 512           # Reduced from 4096 for faster iteration
  train_steps: 100               # Short test run
  val_check_interval: -1
