# 125M Parameter Stress Test for Single RTX 5090 (32GB)
# Architecture: 12 Layers, 768 Hidden, 49k Vocab (SmolLM2)
# Global Batch Size: 1,048,576 Tokens

checkpoints:
  checkpoint_interval: 50
  checkpoints_path: checkpoints_125m_5090
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: null
  save_initial_state: false

data_stages:
- data:
    dataset:
      hf_dataset_or_datasets: "roneneldan/TinyStories"
      hf_dataset_splits: "train"
      text_column_name: "text"
      dataset_processing_num_proc_per_process: 8
      dataset_overwrite_cache: false
    num_loading_workers: 16 # Leveraging 5090 bandwidth
    seed: 42
  name: TinyStories 5090 Test
  start_training_step: 1

general:
  benchmark_csv_path: benchmark_results.csv
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: stress_test_5090
  run: throughput_5090_seq4096_mbs8_recompute
  seed: 42
  step: null

logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info

metrics_logging:
  log_level: 1
  log_detail_interval: 1

model:
  ddp_bucket_cap_mb: 100
  dtype: bfloat16
  init_method:
    std: 0.02
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    hidden_size: 576
    initializer_range: 0.02
    intermediate_size: 1536 
    is_llama_config: true
    max_position_embeddings: 4096
    num_attention_heads: 12
    num_hidden_layers: 24
    num_key_value_heads: 4 # GQA
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1e-05
    rope_scaling: null
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 49152

optimizer:
  accumulate_grad_in_fp32: false
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.001 
    lr_decay_starting_step: null
    lr_decay_steps: 100
    lr_decay_style: cosine
    lr_warmup_steps: 10
    lr_warmup_style: linear
    min_decay_lr: 1e-04
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.1
  zero_stage: 1 # Still useful to shard across 1 GPU (it manages memory fragmentation better)

parallelism:
  dp: 1 # Single GPU Test
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  tp: 1
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
  recompute_layer: false

profiler: null

tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: "HuggingFaceTB/SmolLM2-360M" 
  tokenizer_revision: null

tokens:
  batch_accumulation_per_replica: 32 # 32 * 8 * 1 * 4096 = 1,048,576 GBS
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 8 # Stable Saturation for 5090
  sequence_length: 4096
  train_steps: 100 # 100M tokens
  val_check_interval: -1